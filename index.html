<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Math Mastery</title>
    <style>
        :root { --primary: #4a90e2; --mult: #ed8936; --frac: #9f7aea; --success: #48bb78; --error: #f56565; --grid-line: #cbd5e0;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f7fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 600px; margin-bottom: 20px; box-sizing: border-box;}
        
        /* Math Book Grid Styles */
        .math-grid { font-family: 'Courier New', Courier, monospace; font-size: 2.5rem; color: #2d3748; table-layout: fixed; border-collapse: collapse; margin: 30px auto; width: auto; }
        .math-grid td { width: 40px; height: 40px; text-align: center; vertical-align: middle; }
        
        /* Division Specific */
        .divisor { border-right: 2px solid #2d3748; padding-right: 5px; color: #4a5568;}
        .dividend-box { border-bottom: 2px solid #2d3748;}
        .sub-line { border-bottom: 2px solid #2d3748;}
        
        /* Interactive Inputs */
        .grid-input { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 2.2rem; 
            width: 38px; 
            height: 38px; 
            text-align: center; 
            border: 2px solid #edf2f7; 
            border-radius: 4px; 
            padding: 0; 
            background: #fdfdfd; 
            margin: 1px;
            caret-color: var(--primary);
        }
        .grid-input:focus { outline: 2px solid var(--primary); background: #e6f3ff;}
        .grid-input.active { border-color: var(--primary); background: #e6f3ff; }
        
        /* Mode Colors */
        .mult-mode .grid-input:focus { outline: 2px solid var(--mult); background: #fffaf0;}
        .mult-mode .grid-input.active { border-color: var(--mult); background: #fffaf0;}
        .frac-mode .grid-input:focus { outline: 2px solid var(--frac); background: #faf5ff;}
        .frac-mode .grid-input.active { border-color: var(--frac); background: #faf5ff;}
        
        /* Hide Arrows on inputs */
        .grid-input::-webkit-outer-spin-button,
        .grid-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .val-fixed { color: #2d3748; font-weight: bold; }
        .rem-0 { color: var(--success); font-weight: bold; font-size: 2.8rem; }
        
        button { background: var(--primary); color: white; border: none; padding: 15px 20px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.2s; font-weight: bold;}
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-mult { background: var(--mult); }
        .btn-frac { background: var(--frac); width: 100%; margin-top: 5px;}
        .save-btn { background: var(--success); font-size: 1.3rem; padding: 15px; width: 100%; margin-top: 0;}
        
        .stats { display: flex; justify-content: space-between; background: #edf2f7; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; color: #4a5568;}
    </style>
</head>
<body>

    <div class="card" id="setup-screen">
        <h2>Visual Math Mastery</h2>
        <p>Enter your name and select your challenge! <br><br><i>Note: You are being timed!</i> ⏱️</p>
        <input type="text" id="student-name" placeholder="Your Name" style="font-size: 1.3rem; padding: 10px; border-radius: 8px; border: 2px solid #e2e8f0; width: 80%; margin-bottom: 20px;" autofocus>
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button class="btn-mult" onclick="startQuiz('mult')" style="width: 45%;">✖️ Multiplication</button>
            <button onclick="startQuiz('div')" style="width: 45%;">➗ Division</button>
            <button class="btn-frac" onclick="startQuiz('div-frac')">➗ Division (Mixed Fractions)</button>
        </div>
    </div>

    <div class="card" id="quiz-screen" style="display: none;">
        <h2 id="quiz-title" style="margin-top: 0; color: #2d3748;">Challenge</h2>
        <div class="stats">
            <div>Problem: <span id="stat-problem">1 / 5</span></div>
            <div>Mistakes: <span id="stat-mistakes">0</span></div>
        </div>
        
        <div id="grid-container">
            <table class="math-grid" id="main-grid"></table>
        </div>
        
        <div id="feedback" style="margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 30px; color: var(--primary);"></div>
    </div>

    <div class="card" id="end-screen" style="display: none;">
        <h2>Sets Complete! 🎉</h2>
        <p>You mastered the visual grids.</p>
        <div class="stats" style="flex-direction: column; gap: 10px; text-align: left;">
            <div>⏱️ Time Taken: <span id="final-time" style="float: right;">0</span></div>
            <div>❌ Total Mistakes: <span id="final-mistakes" style="float: right;">0</span></div>
            <div>📊 Grade: <span id="final-score" style="float: right;">0%</span></div>
        </div>
        <button class="save-btn" onclick="saveResults()" id="save-btn">Save Results to Teacher</button>
    </div>

    <script>
        // 🚨 REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL 🚨
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrJwT2sjjRAZj6RFZEI6EcEFCLEesntJtAGWcj8Uz2ck2-UvVXqA8T0OAc3HLnsun9aw/exec"; 

        let studentName = "", quizMode = "";
        let startTime, formattedTimeTaken;
        let currentProblemNum = 1, maxProblems = 5, totalMistakes = 0, totalStepsTaken = 0;
        
        let num1, num2, finalAnswer, remainder;
        let activeInputGroup = [];

        function startQuiz(mode) {
            const nameInput = document.getElementById('student-name').value;
            if (nameInput.trim() === "") { alert("Please enter a name!"); return; }
            studentName = nameInput;
            quizMode = mode;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            const grid = document.getElementById('main-grid');
            grid.className = "math-grid"; // Reset classes
            
            if (mode === 'mult') {
                document.getElementById('quiz-title').innerText = "Multiplication";
                grid.classList.add('mult-mode');
            } else if (mode === 'div-frac') {
                document.getElementById('quiz-title').innerText = "Mixed Fractions";
                grid.classList.add('frac-mode');
            } else {
                document.getElementById('quiz-title').innerText = "Long Division";
            }
            
            startTime = new Date(); 
            generateNewProblem();
        }

        function generateNewProblem() {
            totalStepsTaken = 0;
            activeInputGroup = [];
            document.getElementById('stat-problem').innerText = `${currentProblemNum} / ${maxProblems}`;
            document.getElementById('feedback').innerText = "";
            document.getElementById('grid-container').innerHTML = '<table class="math-grid" id="main-grid"></table>'; // Reset completely
            
            const grid = document.getElementById('main-grid');
            if (quizMode === 'mult') grid.classList.add('mult-mode');
            if (quizMode === 'div-frac') grid.classList.add('frac-mode');

            if (quizMode === 'div' || quizMode === 'div-frac') {
                num2 = Math.floor(Math.random() * 8) + 2; // Divisor (2-9)
                finalAnswer = Math.floor(Math.random() * 80) + 11; // Quotient (11-90)
                
                if (quizMode === 'div-frac') {
                    // Force a remainder between 1 and (divisor - 1)
                    remainder = Math.floor(Math.random() * (num2 - 1)) + 1;
                } else {
                    remainder = 0;
                }
                
                num1 = (num2 * finalAnswer) + remainder; // Calculate dividend
                setupDivisionGrid(num1.toString(), num2, quizMode === 'div-frac');
            } else {
                num1 = Math.floor(Math.random() * 900) + 100; 
                num2 = (Math.floor(Math.random() * 9) + 1) * 10 + (Math.floor(Math.random() * 9) + 1); 
                finalAnswer = num1 * num2;
                setupMultiplicationGrid(num1, num2);
            }
        }

        function setupDivisionGrid(dividendStr, div, isFracMode) {
            const table = document.getElementById('main-grid');
            createRow(table, 'ans-row', dividendStr.length + 2); 
            createRow(table, 'div-row', dividendStr.length + 2); 
            
            const divRowCells = table.rows[1].cells;
            divRowCells[0].innerText = div;
            divRowCells[0].className = "divisor";
            
            for (let i = 0; i < dividendStr.length; i++) {
                divRowCells[i+2].innerText = dividendStr[i];
                divRowCells[i+2].className = "dividend-box val-fixed";
            }
            
            let sequence = [];
            let currValStr = "";
            let startCol = 2; 
            
            for (let i = 0; i < dividendStr.length; i++) {
                currValStr += dividendStr[i];
                let currVal = parseInt(currValStr, 10);
                
                if (currVal >= div || (i === dividendStr.length - 1)) {
                    let q = Math.floor(currVal / div);
                    let qCol = startCol + i;
                    sequence.push({ type: 'input', row: 0, col: qCol, ans: q.toString(), size: 1, dir: 'ltr' });
                    
                    let prod = q * div;
                    let prodRow = sequence.length === 0 ? 2 : table.rows.length;
                    if (sequence.filter(s => s.row === prodRow).length === 0) createRow(table, `mult-${prodRow}`, dividendStr.length + 2);
                    
                    let pStr = prod.toString();
                    sequence.push({ type: 'input', row: table.rows.length - 1, col: qCol - (pStr.length - 1), ans: pStr, size: pStr.length, dir: 'ltr' });
                    
                    let rem = currVal - prod;
                    let remRowIndex = table.rows.length;
                    createRow(table, `rem-${remRowIndex}`, dividendStr.length + 2);
                    
                    let lineRow = table.rows[remRowIndex - 1];
                    for (let c = qCol - (pStr.length - 1); c <= qCol; c++) lineRow.cells[c].className += " sub-line";
                    
                    let rStr = rem === 0 && i < dividendStr.length - 1 ? "0" : rem.toString();
                    let rStartCol = qCol - (rStr.length - 1);
                    sequence.push({ type: 'input', row: remRowIndex, col: rStartCol, ans: rStr, size: rStr.length, dir: 'ltr' });
                    
                    if (i < dividendStr.length - 1) {
                         sequence.push({ type: 'bringdown', row: remRowIndex, col: rStartCol + rStr.length, ans: dividendStr[i+1] });
                         currValStr = (rem === 0) ? "" : rem.toString();
                    } else {
                         if (isFracMode) {
                             sequence.push({ type: 'build-fraction', q: finalAnswer.toString(), r: rem.toString(), d: div.toString() });
                         } else {
                             sequence.push({ type: 'finalrem', row: remRowIndex, col: rStartCol, ans: rem.toString() });
                         }
                    }
                }
            }
            setupInputSequence(table, sequence);
        }

        function setupMultiplicationGrid(n1, n2) {
            const table = document.getElementById('main-grid');
            let n1Str = n1.toString(); let n2Str = n2.toString(); let ansStr = finalAnswer.toString();
            let w = ansStr.length + 1; 
            for(let i=0; i<5; i++) createRow(table, `m-row${i}`, w);
            
            for(let i=0; i<n1Str.length; i++) {
                table.rows[0].cells[w - n1Str.length + i].innerText = n1Str[i]; 
                table.rows[0].cells[w - n1Str.length + i].className = "val-fixed";
            }
            table.rows[1].cells[w - n2Str.length - 1].innerText = '×';
            table.rows[1].cells[w - n2Str.length - 1].className = "val-fixed";
            for(let i=0; i<n2Str.length; i++) {
                table.rows[1].cells[w - n2Str.length + i].innerText = n2Str[i]; 
                table.rows[1].cells[w - n2Str.length + i].className = "val-fixed";
            }
            for(let c=1; c<w; c++) table.rows[1].cells[c].className += " sub-line";
            
            let sequence = [];
            let p1 = n1 * parseInt(n2Str[1]); let p1Str = p1.toString();
            sequence.push({ type: 'input', row: 2, col: w - p1Str.length, ans: p1Str, size: p1Str.length, dir: 'rtl', msg: `Step 1: Multiply ${n1} × ${n2Str[1]}` });
            
            let p2 = n1 * parseInt(n2Str[0]); let p2Str = p2.toString();
            table.rows[3].cells[w - 1].innerText = '0'; table.rows[3].cells[w - 1].className = "val-fixed";
            for(let c=1; c<w; c++) table.rows[3].cells[c].className += " sub-line"; 
            
            sequence.push({ type: 'input', row: 3, col: w - p2Str.length - 1, ans: p2Str, size: p2Str.length, dir: 'rtl', msg: `Step 2: Multiply ${n1} × ${n2Str[0]} (Zero placed!)` });
            sequence.push({ type: 'input', row: 4, col: w - ansStr.length, ans: ansStr, size: ansStr.length, dir: 'rtl', msg: `Step 3: Add them together!` });
            
            setupInputSequence(table, sequence);
        }

        function setupInputSequence(table, sequence) {
            let seqIdx = 0;

            function loadNextStep() {
                if (seqIdx >= sequence.length) { handleProblemCompletion(); return; }
                let step = sequence[seqIdx];
                activeInputGroup = []; 
                if(step.msg) document.getElementById('feedback').innerText = step.msg;

                if (step.type === 'input') {
                    let row = table.rows[step.row];
                    for (let i = 0; i < step.size; i++) {
                        let input = document.createElement('input');
                        input.type = 'text'; input.inputMode = 'numeric'; input.className = 'grid-input active'; 
                        input.dataset.ans = step.ans[i]; 
                        input.maxLength = 1;
                        row.cells[step.col + i].appendChild(input);
                        activeInputGroup.push(input);
                    }
                } else if (step.type === 'build-fraction') {
                    // --- NEW FRACTION UI COMPONENT ---
                    let fracContainer = document.createElement('div');
                    fracContainer.style.marginTop = "20px";
                    fracContainer.style.display = "flex";
                    fracContainer.style.alignItems = "center";
                    fracContainer.style.justifyContent = "center";
                    
                    fracContainer.innerHTML = `
                        <span style="font-size: 1.5rem; color: #4a5568; margin-right: 15px; font-weight: bold;">Mixed Fraction:</span>
                        <input type="text" class="grid-input active" style="width: 50px; height: 50px; font-size: 2rem;" data-ans="${step.q}" maxlength="${step.q.length}">
                        <div style="display: flex; flex-direction: column; align-items: center; margin-left: 10px;">
                            <input type="text" class="grid-input active" style="width: 40px; margin-bottom: 2px;" data-ans="${step.r}" maxlength="${step.r.length}">
                            <div style="border-top: 3px solid #2d3748; width: 100%; margin: 4px 0;"></div>
                            <input type="text" class="grid-input active" style="width: 40px; margin-top: 2px;" data-ans="${step.d}" maxlength="${step.d.length}">
                        </div>
                    `;
                    document.getElementById('grid-container').appendChild(fracContainer);
                    
                    document.getElementById('feedback').innerText = "Write the final answer as a mixed fraction!";
                    document.getElementById('feedback').style.color = "var(--frac)";
                    
                    let inputs = fracContainer.querySelectorAll('input');
                    inputs.forEach(inp => activeInputGroup.push(inp));
                }

                // Attach listeners to whatever inputs were generated
                if (activeInputGroup.length > 0) {
                    activeInputGroup.forEach((inp, idx) => {
                        inp.addEventListener('input', () => {
                            inp.value = inp.value.replace(/[^0-9]/g, ''); 
                            
                            // Check if this specific box is full (1 digit for grid, up to 2 for fractions)
                            if (inp.value.length === parseInt(inp.maxLength)) {
                                if (step.dir === 'rtl' && idx > 0) activeInputGroup[idx-1].focus();
                                else if (step.dir !== 'rtl' && idx < activeInputGroup.length - 1) activeInputGroup[idx+1].focus();
                            }
                            
                            // Check if ALL boxes in the step are correctly filled
                            let allFilled = true;
                            activeInputGroup.forEach(i => { if(i.value.length < i.dataset.ans.length) allFilled = false; });
                            if (allFilled) checkActiveGroup(step.type);
                        });
                    });
                    if(step.dir === 'rtl') activeInputGroup[activeInputGroup.length - 1].focus();
                    else activeInputGroup[0].focus();
                
                } else if (step.type === 'bringdown') {
                    let cell = table.rows[step.row].cells[step.col];
                    cell.innerText = step.ans; cell.className += " val-fixed";
                    document.getElementById('feedback').innerText = `Bring down the ${step.ans}.`;
                    setTimeout(() => { seqIdx++; loadNextStep(); }, 800);
                } else if (step.type === 'finalrem') {
                    let cell = table.rows[step.row].cells[step.col];
                    if(step.ans === "0") { cell.innerText = step.ans; cell.className += " rem-0"; }
                    handleProblemCompletion();
                }
            }

            function checkActiveGroup(stepType) {
                totalStepsTaken++;
                let allCorrect = true;
                activeInputGroup.forEach(inp => { if (inp.value !== inp.dataset.ans) allCorrect = false; });
                
                if (allCorrect) {
                    document.getElementById('feedback').innerText = "Correct!";
                    document.getElementById('feedback').style.color = "var(--success)";
                    
                    activeInputGroup.forEach(inp => {
                        if (stepType === 'build-fraction') {
                            // Style the fraction inputs to look like plain text
                            inp.disabled = true;
                            inp.style.border = "none";
                            inp.style.background = "transparent";
                            inp.style.color = "#2d3748";
                            inp.style.fontWeight = "bold";
                        } else {
                            // Standard grid conversion
                            let cell = inp.parentElement; 
                            cell.innerText = inp.value;
                            cell.className += " val-fixed";
                        }
                    });
                    
                    seqIdx++;
                    setTimeout(() => { document.getElementById('feedback').innerText = ""; loadNextStep(); }, 500);
                } else {
                    totalMistakes++;
                    document.getElementById('stat-mistakes').innerText = totalMistakes;
                    document.getElementById('feedback').innerText = "Mistake in the boxes. Try again! ❌";
                    document.getElementById('feedback').style.color = "var(--error)";
                    
                    activeInputGroup.forEach(inp => inp.value = "");
                    if(sequence[seqIdx].dir === 'rtl') activeInputGroup[activeInputGroup.length - 1].focus();
                    else activeInputGroup[0].focus();
                }
            }
            loadNextStep(); 
        }

        function handleProblemCompletion() {
            let symbol = quizMode === 'mult' ? '×' : '÷';
            let ansText = finalAnswer;
            if (quizMode === 'div-frac') ansText = `${finalAnswer} and ${remainder}/${num2}`;
            
            document.getElementById('feedback').innerText = `Finished! ${num1} ${symbol} ${num2} = ${ansText} 🎉`;
            document.getElementById('feedback').style.color = "var(--success)";
            
            setTimeout(() => {
                if (currentProblemNum >= maxProblems) showEndScreen();
                else { currentProblemNum++; generateNewProblem(); }
            }, 3000);
        }

        function createRow(table, rowId, numCells) {
            let row = table.insertRow(-1);
            for (let i = 0; i < numCells; i++) row.insertCell(-1); 
        }

        function showEndScreen() {
            const timeDiff = Math.floor((new Date() - startTime) / 1000); 
            formattedTimeTaken = `${Math.floor(timeDiff / 60)}m ${timeDiff % 60}s`;

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            let grade = Math.round(((totalStepsTaken - totalMistakes) / totalStepsTaken) * 100);
            if (grade < 0) grade = 0;
            if (totalStepsTaken === 0) grade = 100; 
            
            document.getElementById('final-time').innerText = formattedTimeTaken;
            document.getElementById('final-mistakes').innerText = totalMistakes;
            document.getElementById('final-score').innerText = grade + "%";
        }

        function saveResults() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving to Database..."; btn.disabled = true;

            const data = {
                name: `[${quizMode.toUpperCase()}] ` + studentName, 
                attempts: totalStepsTaken, 
                correct: maxProblems,
                score: document.getElementById('final-score').innerText,
                time: formattedTimeTaken
            };

            fetch(SCRIPT_URL, {
                method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data)
            })
            .then(() => { alert("Results saved!"); location.reload(); })
            .catch(() => { alert("Error saving. Check internet."); btn.innerText = "Save Results to Teacher"; btn.disabled = false; });
        }
    </script>
</body>
</html>
