<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guided Long Division</title>
    <style>
        :root { --primary: #4a90e2; --success: #48bb78; --error: #f56565; }
        body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 20px; }
        
        /* New Styles for the Chat/Log layout */
        .history-log { background: #edf2f7; padding: 15px; border-radius: 10px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; font-size: 1.1rem; color: #2d3748; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .log-correct { color: var(--success); font-weight: bold; float: right; }
        
        #question-header { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: #2d3748; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;}
        #current-prompt { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
        
        input { font-size: 1.5rem; width: 100%; text-align: center; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 15px; box-sizing: border-box;}
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s;}
        button:hover { opacity: 0.9; }
        .save-btn { background: var(--success); font-size: 1.3rem; padding: 15px; }
        .stats { display: flex; justify-content: space-between; background: #edf2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #4a5568;}
    </style>
</head>
<body>

    <div class="card" id="setup-screen">
        <h2 style="text-align: center;">Guided Long Division</h2>
        <p>Complete <b>5 problems</b>. We will guide you step-by-step through the process. <br><br><i>Time is ticking!</i> ⏱️</p>
        <input type="text" id="student-name" placeholder="Your Name" autofocus>
        <button onclick="startQuiz()">Start Challenge</button>
    </div>

    <div class="card" id="quiz-screen" style="display: none;">
        <div class="stats">
            <div>Problem: <span id="stat-problem">1 / 5</span></div>
            <div>Mistakes: <span id="stat-mistakes">0</span></div>
        </div>
        
        <div id="question-header">? ÷ ?</div>
        
        <div class="history-log" id="history-log">
            </div>

        <div id="current-prompt">Generating problem...</div>
        <input type="number" id="answer" placeholder="Type here...">
        <button onclick="checkStep()" id="submit-btn">Submit Step</button>
        
        <div id="feedback" style="margin-top: 10px; font-size: 1.1rem; font-weight: bold; height: 25px; text-align: center;"></div>
    </div>

    <div class="card" id="end-screen" style="display: none;">
        <h2 style="text-align: center;">All Sets Complete! 🎉</h2>
        <div class="stats" style="flex-direction: column; gap: 10px;">
            <div>⏱️ Time Taken: <span id="final-time" style="float: right;">0</span></div>
            <div>❌ Total Mistakes: <span id="final-mistakes" style="float: right;">0</span></div>
            <div>📊 Grade: <span id="final-score" style="float: right;">0%</span></div>
        </div>
        <button class="save-btn" onclick="saveResults()" id="save-btn">Save Results to Teacher</button>
    </div>

    <script>
        // 🚨 REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL 🚨
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrJwT2sjjRAZj6RFZEI6EcEFCLEesntJtAGWcj8Uz2ck2-UvVXqA8T0OAc3HLnsun9aw/exec"; 

        let studentName = "";
        let startTime;
        let formattedTimeTaken = "";
        
        // Session tracking
        let currentProblemNum = 1;
        const maxProblems = 5; // Reduced to 5 because division has many steps
        let totalMistakes = 0;
        let totalStepsTaken = 0;
        
        // Step Logic Array
        let stepSequence = [];
        let currentStepIndex = 0;

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value;
            if (nameInput.trim() === "") { alert("Please enter a name!"); return; }
            studentName = nameInput;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            startTime = new Date(); 
            generateNewProblem();
        }

        function generateNewProblem() {
            // Generate a 1-digit divisor (2 to 9) and a random answer to guarantee whole numbers for now
            let divisor = Math.floor(Math.random() * 8) + 2; 
            let finalAnswer = Math.floor(Math.random() * 80) + 11; // 11 to 90
            let dividend = (divisor * finalAnswer).toString();
            
            document.getElementById('question-header').innerText = `${dividend} ÷ ${divisor}`;
            document.getElementById('history-log').innerHTML = ""; // Clear log
            document.getElementById('stat-problem').innerText = `${currentProblemNum} / ${maxProblems}`;
            
            stepSequence = [];
            let currentStr = "";
            
            // Build the conversational steps
            for (let i = 0; i < dividend.length; i++) {
                currentStr += dividend[i];
                let currentNum = parseInt(currentStr, 10);
                
                // If the number is big enough to divide, or we are at the very last digit
                if (currentNum >= divisor || (i === dividend.length - 1)) {
                    let q = Math.floor(currentNum / divisor);
                    
                    if (i > 0) stepSequence.push({ msg: `Bring down the ${dividend[i]}. What is ${currentNum} ÷ ${divisor}?`, ans: q });
                    else stepSequence.push({ msg: `Look at the first part: ${currentNum}. What is ${currentNum} ÷ ${divisor}?`, ans: q });
                    
                    let prod = q * divisor;
                    stepSequence.push({ msg: `Multiply: ${divisor} × ${q} = ?`, ans: prod });
                    
                    let rem = currentNum - prod;
                    stepSequence.push({ msg: `Subtract: ${currentNum} - ${prod} = ?`, ans: rem });
                    
                    currentStr = rem === 0 ? "" : rem.toString();
                }
            }
            stepSequence.push({ msg: `Awesome! What is the final answer for ${dividend} ÷ ${divisor}?`, ans: finalAnswer });
            
            currentStepIndex = 0;
            loadNextStep();
        }

        function loadNextStep() {
            document.getElementById('current-prompt').innerText = stepSequence[currentStepIndex].msg;
            document.getElementById('answer').value = '';
            document.getElementById('answer').focus();
        }

        function checkStep() {
            const val = document.getElementById('answer').value;
            if (val === "") return;

            totalStepsTaken++;
            const expectedAnswer = stepSequence[currentStepIndex].ans;
            const isCorrect = (parseInt(val) === expectedAnswer);
            const feedback = document.getElementById('feedback');

            if (isCorrect) {
                feedback.innerText = "Correct! 🌟";
                feedback.style.color = "var(--success)";
                
                // Add to history log
                const logDiv = document.getElementById('history-log');
                logDiv.innerHTML += `<div class="log-entry">${stepSequence[currentStepIndex].msg} <b>${val}</b> <span class="log-correct">✓</span></div>`;
                logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll to bottom

                currentStepIndex++;

                if (currentStepIndex >= stepSequence.length) {
                    // Problem finished!
                    if (currentProblemNum >= maxProblems) {
                        setTimeout(showEndScreen, 1000);
                    } else {
                        currentProblemNum++;
                        feedback.innerText = "Problem complete! Loading next...";
                        setTimeout(generateNewProblem, 1500);
                    }
                } else {
                    // Load next step in the sequence
                    setTimeout(() => {
                        feedback.innerText = "";
                        loadNextStep();
                    }, 500);
                }
            } else {
                totalMistakes++;
                document.getElementById('stat-mistakes').innerText = totalMistakes;
                feedback.innerText = "Incorrect. Try again! ❌";
                feedback.style.color = "var(--error)";
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
            }
        }

        function showEndScreen() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); 
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            formattedTimeTaken = `${minutes}m ${seconds}s`;

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            // Calculate a grade based on steps vs mistakes
            let grade = Math.round(((totalStepsTaken - totalMistakes) / totalStepsTaken) * 100);
            if (grade < 0) grade = 0;
            
            document.getElementById('final-time').innerText = formattedTimeTaken;
            document.getElementById('final-mistakes').innerText = totalMistakes;
            document.getElementById('final-score').innerText = grade + "%";
        }

        function saveResults() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving to Database...";
            btn.disabled = true;

            let grade = Math.round(((totalStepsTaken - totalMistakes) / totalStepsTaken) * 100);

            const data = {
                name: studentName,
                attempts: totalStepsTaken, 
                correct: maxProblems,
                score: grade + "%",
                time: formattedTimeTaken
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }, 
                body: JSON.stringify(data)
            })
            .then(response => alert("Results saved!"))
            .then(() => location.reload())
            .catch(error => {
                alert("Error saving. Check internet.");
                btn.innerText = "Save Results to Teacher";
                btn.disabled = false;
            });
        }

        document.getElementById('answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('quiz-screen').style.display === 'block') checkStep();
                else if (document.getElementById('setup-screen').style.display !== 'none') startQuiz();
            }
        });
    </script>
</body>
</html>
