<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Math Mastery</title>
    <style>
        :root { --primary: #4a90e2; --success: #48bb78; --error: #f56565; }
        body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 450px; margin-bottom: 20px; }
        #question { font-size: 3rem; font-weight: bold; margin: 20px 0; color: #2d3748; letter-spacing: 2px; }
        input { font-size: 1.8rem; width: 80%; text-align: center; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s;}
        button:hover { opacity: 0.9; }
        .save-btn { background: var(--success); font-size: 1.3rem; padding: 15px; }
        .stats { display: flex; justify-content: space-between; background: #edf2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #4a5568;}
        .progress-text { font-size: 1.2rem; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card" id="setup-screen">
        <h2>Advanced Multiplication</h2>
        <p>Complete <b>10 questions</b>. Mistakes mean you try again. <br><br><i>Note: You are being timed!</i> ⏱️</p>
        <input type="text" id="student-name" placeholder="Your Name" autofocus>
        <button onclick="startQuiz()">Start Challenge</button>
    </div>

    <div class="card" id="quiz-screen" style="display: none;">
        <div class="progress-text" id="progress-text">Question 1 of 10</div>
        
        <div class="stats">
            <div>Total Tries: <span id="stat-attempts">0</span></div>
            <div>Accuracy: <span id="stat-score">100%</span></div>
        </div>
        
        <div id="question">? × ?</div>
        <input type="number" id="answer" placeholder="Your Answer">
        <button onclick="checkAnswer()" id="submit-btn">Submit Answer</button>
        
        <div id="feedback" style="margin-top: 15px; font-size: 1.2rem; font-weight: bold; height: 30px;"></div>
    </div>

    <div class="card" id="end-screen" style="display: none;">
        <h2>Set Complete! 🎉</h2>
        <div class="stats" style="flex-direction: column; gap: 10px; text-align: left;">
            <div>⏱️ Time Taken: <span id="final-time" style="float: right;">0</span></div>
            <div>🎯 Total Tries: <span id="final-attempts" style="float: right;">0</span></div>
            <div>📊 Final Accuracy: <span id="final-score" style="float: right;">0%</span></div>
        </div>
        <button class="save-btn" onclick="saveResults()" id="save-btn">Save Results to Teacher</button>
    </div>

    <script>
        // 🚨 REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT URL 🚨
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrJwT2sjjRAZj6RFZEI6EcEFCLEesntJtAGWcj8Uz2ck2-UvVXqA8T0OAc3HLnsun9aw/exec"; 

        let num1, num2, correctAnswer;
        let studentName = "";
        
        // Session tracking
        let currentQuestion = 1;
        const maxQuestions = 10;
        let totalAttempts = 0;
        
        // Timer variables
        let startTime;
        let formattedTimeTaken = "";

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value;
            if (nameInput.trim() === "") {
                alert("Please enter a name!");
                return;
            }
            studentName = nameInput;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            // Start the clock!
            startTime = new Date(); 
            
            generateQuestion();
        }

        function generateQuestion() {
            num1 = Math.floor(Math.random() * 900) + 100; // 100 to 999
            num2 = Math.floor(Math.random() * 90) + 10;   // 10 to 99
            correctAnswer = num1 * num2;
            
            document.getElementById('progress-text').innerText = `Question ${currentQuestion} of ${maxQuestions}`;
            document.getElementById('question').innerText = `${num1} × ${num2}`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const val = document.getElementById('answer').value;
            if (val === "") return;

            totalAttempts++;
            const isCorrect = (parseInt(val) === correctAnswer);

            const accuracy = Math.round((currentQuestion / totalAttempts) * 100);
            document.getElementById('stat-attempts').innerText = totalAttempts;
            document.getElementById('stat-score').innerText = accuracy + "%";

            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.innerText = "Correct! 🌟";
                feedback.style.color = "var(--success)";
                
                if (currentQuestion >= maxQuestions) {
                    setTimeout(showEndScreen, 1000);
                } else {
                    currentQuestion++;
                    setTimeout(generateQuestion, 1200);
                }
            } else {
                feedback.innerText = "Incorrect. Try again! ❌";
                feedback.style.color = "var(--error)";
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
            }
        }

        function showEndScreen() {
            // Stop the clock and calculate time
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // total seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            formattedTimeTaken = `${minutes}m ${seconds}s`;

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            
            const accuracy = Math.round((maxQuestions / totalAttempts) * 100);
            
            // Update final screen UI
            document.getElementById('final-time').innerText = formattedTimeTaken;
            document.getElementById('final-attempts').innerText = totalAttempts;
            document.getElementById('final-score').innerText = accuracy + "%";
        }

        function saveResults() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving to Database...";
            btn.disabled = true;

            const accuracy = Math.round((maxQuestions / totalAttempts) * 100) + "%";

            // Add the time data to the package we send to Google
            const data = {
                name: studentName,
                attempts: totalAttempts,
                correct: maxQuestions,
                score: accuracy,
                time: formattedTimeTaken
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }, 
                body: JSON.stringify(data)
            })
            .then(response => {
                alert("Results saved successfully! Great job.");
                location.reload(); 
            })
            .catch(error => {
                alert("Error saving results. Check your internet connection.");
                btn.innerText = "Save Results to Teacher";
                btn.disabled = false;
            });
        }

        document.getElementById('answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('quiz-screen').style.display === 'block') {
                    checkAnswer();
                } else if (document.getElementById('setup-screen').style.display !== 'none') {
                    startQuiz();
                }
            }
        });
    </script>
</body>
</html>
