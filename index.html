<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Quiz (3-12)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #2d3748; margin-bottom: 1.5rem; }
        #question { font-size: 3rem; font-weight: bold; color: #4a5568; margin: 20px 0; }
        input { font-size: 2rem; width: 100px; text-align: center; border: 2px solid #cbd5e0; border-radius: 8px; padding: 5px; margin-bottom: 20px; outline: none; }
        input:focus { border-color: #4299e1; }
        button { background: #4299e1; color: white; border: none; padding: 10px 25px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #3182ce; }
        #feedback { margin-top: 15px; font-weight: bold; height: 24px; }
        .correct { color: #48bb78; }
        .wrong { color: #f56565; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Math Quiz</h1>
        <div id="question">? x ?</div>
        <input type="number" id="answer" placeholder="Ans" autofocus>
        <br>
        <button onclick="checkAnswer()">Submit</button>
        <div id="feedback"></div>
    </div>

    <script>
        let num1, num2, correctAnswer;

        function generateQuestion() {
            num1 = Math.floor(Math.random() * 10) + 3; // 3 to 12
            num2 = Math.floor(Math.random() * 10) + 3; // 3 to 12
            correctAnswer = num1 * num2;
            document.getElementById('question').innerText = `${num1} × ${num2}`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedback = document.getElementById('feedback');
            if (userAnswer === correctAnswer) {
                feedback.innerText = "Correct! 🎉";
                feedback.className = "correct";
                setTimeout(generateQuestion, 1200);
            } else {
                feedback.innerText = "Try again! ❌";
                feedback.className = "wrong";
            }
        }

        // Allow pressing "Enter" to submit
        document.getElementById('answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        generateQuestion();
    </script>
</body>
</html>
