<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tracker</title>
    <style>
        :root { --primary: #4a90e2; --success: #48bb78; --error: #f56565; }
        body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; margin-bottom: 20px; }
        #question { font-size: 3rem; font-weight: bold; margin: 20px 0; color: #2d3748; }
        input { font-size: 1.5rem; width: 80%; text-align: center; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .save-btn { background: var(--success); }
        .stats { display: flex; justify-content: space-around; background: #edf2f7; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #4a5568;}
    </style>
</head>
<body>

    <div class="card" id="setup-screen">
        <h2>Welcome!</h2>
        <p>Please enter your name to begin.</p>
        <input type="text" id="student-name" placeholder="Your Name" autofocus>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div class="card" id="quiz-screen" style="display: none;">
        <div class="stats">
            <div>Attempts: <span id="stat-attempts">0</span></div>
            <div>Score: <span id="stat-score">0%</span></div>
        </div>
        
        <div id="question">? × ?</div>
        <input type="number" id="answer" placeholder="Ans">
        <button onclick="checkAnswer()">Submit Answer</button>
        <button class="save-btn" onclick="saveResults()" id="save-btn">Finish & Save Results</button>
        <div id="feedback" style="margin-top: 15px; font-weight: bold; height: 24px;"></div>
    </div>

    <script>
        // 🚨 REPLACE THE LINK BELOW WITH YOUR GOOGLE APPS SCRIPT URL 🚨
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrJwT2sjjRAZj6RFZEI6EcEFCLEesntJtAGWcj8Uz2ck2-UvVXqA8T0OAc3HLnsun9aw/exec"; 

        let num1, num2, correctAnswer;
        let studentName = "";
        let sessionAttempts = 0;
        let sessionCorrect = 0;

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value;
            if (nameInput.trim() === "") {
                alert("Please enter a name!");
                return;
            }
            studentName = nameInput;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            generateQuestion();
        }

        function generateQuestion() {
            num1 = Math.floor(Math.random() * 10) + 3; 
            num2 = Math.floor(Math.random() * 10) + 3; 
            correctAnswer = num1 * num2;
            document.getElementById('question').innerText = `${num1} × ${num2}`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const val = document.getElementById('answer').value;
            if (val === "") return;

            sessionAttempts++;
            const isCorrect = (parseInt(val) === correctAnswer);
            if (isCorrect) sessionCorrect++;

            // Update Stats UI
            document.getElementById('stat-attempts').innerText = sessionAttempts;
            document.getElementById('stat-score').innerText = Math.round((sessionCorrect / sessionAttempts) * 100) + "%";

            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerText = "Correct! 🌟";
                feedback.style.color = "var(--success)";
                setTimeout(generateQuestion, 1000);
            } else {
                feedback.innerText = `Incorrect. It was ${correctAnswer}`;
                feedback.style.color = "var(--error)";
                setTimeout(generateQuestion, 2000);
            }
        }

        function saveResults() {
            if (sessionAttempts === 0) {
                alert("You haven't answered any questions yet!");
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving to Database...";
            btn.disabled = true;

            const finalScore = Math.round((sessionCorrect / sessionAttempts) * 100) + "%";

            const data = {
                name: studentName,
                attempts: sessionAttempts,
                correct: sessionCorrect,
                score: finalScore
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }, // Avoids CORS issues
                body: JSON.stringify(data)
            })
            .then(response => {
                alert("Results saved successfully! Great job.");
                location.reload(); // Restart the app
            })
            .catch(error => {
                alert("Error saving results. Check your internet connection.");
                btn.innerText = "Finish & Save Results";
                btn.disabled = false;
            });
        }

        document.getElementById('answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
        document.getElementById('student-name').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startQuiz();
        });
    </script>
</body>
</html>
